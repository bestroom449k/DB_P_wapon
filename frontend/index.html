<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>다섯 빛 공방</title>
    <meta name="description" content="뽑고, 벼리고, 모으는 수집형 힐링 게임" />
    <meta name="theme-color" content="#0b0e26" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Ccircle r='48' fill='%230b0e26'/%3E%3Cpath d='M0 -40L23.51 32.36L-38.04 -12.36L38.04 -12.36L-23.51 32.36Z' fill='none' stroke='%23ffcf8a' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Gowun+Dodum&display=swap"
    />
    <!-- 글자와 메뉴(title.css), 강화 타임라인(timeline.css), 3D 장면(js/function: 기능, js/design: 디자인) -->
    <link rel="stylesheet" href="css/title.css" />
    <link rel="stylesheet" href="css/timeline.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/function/main.js"></script>
    <script type="module" src="js/function/menu.js"></script>
    <script type="module" src="js/function/auth.js"></script>
  </head>
  <body>
    <p class="loader" role="status">공방에 불을 지피는 중</p>

    <input
      class="gate"
      type="radio"
      id="gate"
      autofocus
      aria-label="공방 문 열기"
    />

    <!-- 창 뒤의 어두운 막 (누르면 창이 닫힘) -->
    <a class="scrim" href="#" tabindex="-1" aria-hidden="true"></a>

    <!-- 로그인 창 ("게임 시작"을 누르면 열림) -->
    <section class="panel" id="login" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <form class="form" data-auth="login" novalidate>
        <h2 class="form__title" id="loginTitle">로그인</h2>
        <label class="field">
          <span>아이디</span>
          <input name="loginId" autocomplete="username" required maxlength="20" />
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input name="password" type="password" autocomplete="current-password" required maxlength="64" />
        </label>
        <p class="form__error" role="alert"></p>
        <div class="form__actions">
          <a class="btn btn--ghost" href="#">닫기</a>
          <button class="btn" type="submit">로그인</button>
        </div>
        <p class="form__switch">처음 오셨나요? <a href="#signup">회원가입</a></p>
      </form>
    </section>

    <!-- 회원가입 창 -->
    <section class="panel" id="signup" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
      <form class="form" data-auth="signup" novalidate>
        <h2 class="form__title" id="signupTitle">회원가입</h2>
        <label class="field">
          <span>아이디</span>
          <input name="loginId" autocomplete="username" required maxlength="20" />
          <small>영문 소문자, 숫자, 밑줄(_)로 4~20자</small>
        </label>
        <label class="field">
          <span>닉네임</span>
          <input name="nickname" autocomplete="nickname" required maxlength="12" />
          <small>게임에 보이는 이름, 한글, 영문, 숫자로 2~12자</small>
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input name="password" type="password" autocomplete="new-password" required maxlength="64" />
          <small>8자 이상</small>
        </label>
        <label class="field">
          <span>비밀번호 확인</span>
          <input name="passwordConfirm" type="password" autocomplete="new-password" required maxlength="64" />
        </label>
        <p class="form__error" role="alert"></p>
        <div class="form__actions">
          <a class="btn btn--ghost" href="#">닫기</a>
          <button class="btn" type="submit">가입하기</button>
        </div>
        <p class="form__switch">이미 계정이 있나요? <a href="#login">로그인</a></p>
      </form>
    </section>

    <!-- 알림 (주소 뒤의 #이름으로 잠깐 떴다 사라짐) -->
    <p class="toast" id="welcome" role="status"></p>
    <p class="toast" id="play" role="status">공방 안쪽은 아직 준비 중이에요</p>
    <p class="toast" id="logged-out" role="status">로그아웃했어요</p>

    <section class="farewell" id="bye">
      <p>공방의 불을 껐어요. 다음에 또 만나요.</p>
      <a class="btn btn--ghost" href="#">다시 열기</a>
    </section>

    <canvas id="scene" aria-hidden="true"></canvas>

    <main class="hud">
      <p class="player" id="player"></p>
      <h1 class="logo">다섯 빛 공방</h1>
      <p class="tagline">뽑고, 벼리고, 모으는 작은 공방</p>

      <label class="press" for="gate"
        >클릭하거나 Space를 눌러 공방 문을 여세요</label
      >
      <nav class="menu" aria-label="메인 메뉴">
        <a class="menu__item" href="#login" id="menuStart">게임 시작</a>
        <a class="menu__item" href="#signup" id="menuAccount">회원가입</a>
        <a class="menu__item menu__item--guest" href="#login">로그인</a>
        <a class="menu__item" href="#bye">게임 종료</a>
      </nav>

      <div class="forge" aria-hidden="true">
        <span class="pips"><i></i><i></i><i></i><i></i><i></i></span>
      </div>

      <p class="keys"><kbd>Tab</kbd> 이동 <kbd>Enter</kbd> 확인</p>
    </main>
  </body>
</html>
