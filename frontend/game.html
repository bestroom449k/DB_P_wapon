<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>뽑기 · 다섯 빛 공방</title>
    <meta name="description" content="달빛 아래 공방에서 마도서를 뽑아요" />
    <meta name="theme-color" content="#0b0e26" />
    <!-- 타이틀에서 책 속으로 들어왔을 때만 책장 빛 막(.veil)을 보여 준다: 표시(js/title/function/enter.js가 남김)를 화면을 그리기 전에 읽고 지운다.
         공방, 게시판에서 돌아오거나 새로고침하면 표시가 없어서 노란 빛 없이 바로 게임 화면이 나온다 -->
    <script>
      try {
        if (sessionStorage.getItem('enter') === 'book') {
          sessionStorage.removeItem('enter');
          document.documentElement.classList.add('from-book');
        }
      } catch {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Ccircle r='48' fill='%230b0e26'/%3E%3Cpath d='M0 -40L23.51 32.36L-38.04 -12.36L38.04 -12.36L-23.51 32.36Z' fill='none' stroke='%23ffcf8a' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Gowun+Dodum&display=swap"
    />
    <!-- 게임 화면의 글자와 버튼: 공통 색과 글꼴(tokens.css, 타이틀과 같이 씀), 기본·알림(base.css), 위쪽(hud.css), 아래쪽(actions.css), 뽑기 영상(summon.css) -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/game/base.css" />
    <link rel="stylesheet" href="css/game/hud.css" />
    <link rel="stylesheet" href="css/game/actions.css" />
    <link rel="stylesheet" href="css/game/summon.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <!-- 3D 장면(js/game/main.js), 버튼과 골드 표시(js/game/function/hud.js) -->
    <script type="module" src="js/game/main.js"></script>
    <script type="module" src="js/game/function/hud.js"></script>
  </head>
  <body>
    <!-- 아이콘 묶음: 아래에서 <use href="#i-이름">으로 불러 쓴다 -->
    <svg class="icons" aria-hidden="true">
      <defs>
        <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbe7b0" />
          <stop offset=".55" stop-color="#e2b866" />
          <stop offset="1" stop-color="#b98a3e" />
        </linearGradient>
        <linearGradient id="g-card" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4a4fb8" />
          <stop offset="1" stop-color="#22256a" />
        </linearGradient>
      </defs>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M19 12H5.5M11 5.5 4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <!-- 네 갈래 별: 버튼 장식, 확률 버튼 -->
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="M12 1.5c.5 5.6 2.9 8 8.5 10.5-5.6 2.5-8 4.9-8.5 10.5-.5-5.6-2.9-8-8.5-10.5C9.1 9.5 11.5 7.1 12 1.5Z" fill="currentColor" />
      </symbol>
      <!-- 골드 동전: 다섯 등급의 별이 새겨져 있다 -->
      <symbol id="i-coin" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="url(#g-gold)" />
        <circle cx="12" cy="12" r="7.4" fill="none" stroke="#9c7130" stroke-opacity=".55" stroke-width="1" />
        <path d="M12 7.2 13.3 10.6 16.8 10.8 14.1 13 15 16.4 12 14.5 9 16.4 9.9 13 7.2 10.8 10.7 10.6Z" fill="#fff6dc" />
      </symbol>
      <!-- 뽑기 카드 -->
      <symbol id="i-card" viewBox="0 0 24 24">
        <rect x="5" y="2.5" width="14" height="19" rx="2.4" fill="url(#g-card)" stroke="#ffe6b8" stroke-width="1.2" />
        <path d="M12 7.6 12.9 11.1 16.4 12 12.9 12.9 12 16.4 11.1 12.9 7.6 12 11.1 11.1Z" fill="#fff" />
      </symbol>
      <!-- 강화: 룬을 새기는 깃펜과 새겨진 룬 -->
      <symbol id="i-quill" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 3.5c-6 .6-10.4 4.4-12.6 10.8l-1.4 4.2 4.2-1.4c6.4-2.2 10.2-6.6 9.8-13.6Z" />
          <path d="M6.5 18.5 3 22M11.5 12.5l-2 2" />
          <path d="M15.5 19.5h5M18 17v5" />
        </g>
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5.6c3.2-1.2 6.2-.9 9 1.2 2.8-2.1 5.8-2.4 9-1.2v13c-3.2-1.2-6.2-.9-9 1.2-2.8-2.1-5.8-2.4-9-1.2Z" />
          <path d="M12 6.8v13" />
        </g>
      </symbol>
      <symbol id="i-shop" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 4.5h15L21 9a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z" />
          <path d="M5 11.8V20h14v-8.2M10 20v-4.5h4V20" />
        </g>
      </symbol>
      <!-- 거래소: 주고받는 화살표 두 개 -->
      <symbol id="i-trade" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h14.5M15 4.5 18.5 8 15 11.5" />
          <path d="M20 16H5.5M9 12.5 5.5 16 9 19.5" />
        </g>
      </symbol>
      <!-- 커뮤니티: 겹친 말풍선 두 개 -->
      <symbol id="i-talk" viewBox="0 0 24 24">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4.5h10.5A1.5 1.5 0 0 1 16 6v6.5a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3H4a1.5 1.5 0 0 1-1.5-1.5V6A1.5 1.5 0 0 1 4 4.5Z" />
          <path d="M19 8.5h.5A1.5 1.5 0 0 1 21 10v6a1.5 1.5 0 0 1-1.5 1.5H19V20l-3-2.5h-4" />
        </g>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="m6.5 6.5 11 11m0-11-11 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
    </svg>

    <!-- 3D 장면: 밤하늘, 떠 있는 섬과 불 켜진 성, 검은 대리석 테라스, 마법진, 카드 다섯 장, 빛 기둥 -->
    <canvas id="stage" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>

    <!-- 뽑기 영상: 뽑는 동안 화면을 덮는다 (5등급은 황금판 20초, 나머지는 일반판 15초) -->
    <section class="summon" id="summon" hidden>
      <video class="summon__video" id="summonNormal" src="video/gacha-normal.mp4" preload="auto" playsinline hidden></video>
      <video class="summon__video" id="summonLegendary" src="video/gacha-legendary.mp4" preload="auto" playsinline hidden></video>
      <button class="summon__skip" id="summonSkip" type="button">건너뛰기</button>
    </section>

    <!-- 뽑기 결과 명판: 영상 속 카드가 멈추는 순간 아래에 뜬다. "확인"을 누르면 영상과 함께 걷힌다 -->
    <section class="result" id="result" aria-labelledby="resultName" aria-live="polite" hidden>
      <div class="result__plate">
        <p class="result__grade" id="resultGrade"></p>
        <h2 class="result__name" id="resultName"></h2>
        <p class="result__desc" id="resultDesc"></p>
        <p class="result__new" id="resultNew" hidden>처음 얻은 마도서예요. 도감에 기록했어요.</p>
      </div>
      <button class="result__ok" id="resultOk" type="button">확인</button>
    </section>

    <!-- 위쪽: 뒤로가기와 제목, 골드, 확률 -->
    <header class="top">
      <a class="back" href="index.html" aria-label="타이틀 화면으로">
        <svg class="icon"><use href="#i-back" /></svg>
      </a>
      <h1 class="top__title">뽑기</h1>
      <span class="top__rule" aria-hidden="true"></span>

      <div class="top__right">
        <p class="gold" aria-live="polite">
          <svg class="icon"><use href="#i-coin" /></svg>
          <span class="gold__value" id="goldValue">로그인 전</span>
          <span class="gold__unit" id="goldUnit" hidden>골드</span>
        </p>
        <button class="chip" type="button" popovertarget="rates" aria-label="뽑기 확률 보기">
          <svg class="icon"><use href="#i-spark" /></svg>
          <span class="chip__text">확률</span>
        </button>
      </div>
    </header>

    <!-- 확률 창: 값은 db/gameData.json의 grades와 같다 -->
    <section class="rates" id="rates" popover aria-labelledby="ratesTitle">
      <h2 class="rates__title" id="ratesTitle">뽑기 확률</h2>
      <ol class="rates__list">
        <li style="--c: var(--g1)"><span class="rates__name">1등급 <b>무쇠</b></span><span class="rates__pct">60%</span></li>
        <li style="--c: var(--g2)"><span class="rates__name">2등급 <b>비취</b></span><span class="rates__pct">25%</span></li>
        <li style="--c: var(--g3)"><span class="rates__name">3등급 <b>자수정</b></span><span class="rates__pct">10%</span></li>
        <li style="--c: var(--g4)"><span class="rates__name">4등급 <b>홍옥</b></span><span class="rates__pct">4%</span></li>
        <li style="--c: var(--g5)"><span class="rates__name">5등급 <b>황금</b></span><span class="rates__pct">1%</span></li>
      </ol>
      <p class="rates__note">한 번 뽑을 때마다 마도서 한 권을 얻어요.</p>
      <button class="rates__close" type="button" popovertarget="rates" popovertargetaction="hide" aria-label="확률 창 닫기">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
    </section>

    <!-- 아래 왼쪽: 다른 기능으로 가는 메뉴 -->
    <nav class="dock" aria-label="공방 메뉴">
      <a class="dock__item" href="atelier.html#/enhance">
        <svg class="icon"><use href="#i-quill" /></svg>
        <span>강화</span>
      </a>
      <a class="dock__item" href="atelier.html#/collection">
        <svg class="icon"><use href="#i-book" /></svg>
        <span>도감</span>
      </a>
      <a class="dock__item" href="atelier.html#/shop">
        <svg class="icon"><use href="#i-shop" /></svg>
        <span>상점</span>
      </a>
      <a class="dock__item" href="atelier.html#/market">
        <svg class="icon"><use href="#i-trade" /></svg>
        <span>거래소</span>
      </a>
      <a class="dock__item" href="board.html">
        <svg class="icon"><use href="#i-talk" /></svg>
        <span>커뮤니티</span>
      </a>
    </nav>

    <!-- 아래 오른쪽: 주 버튼 (적힌 가격은 db/gameData.json의 draw.cost와 같게) -->
    <button class="draw" id="drawButton" type="button">
      <span class="draw__label">
        <svg class="icon"><use href="#i-card" /></svg>
        <span class="draw__text" id="drawText">1회 뽑기</span>
      </span>
      <span class="draw__cost">
        <svg class="icon"><use href="#i-coin" /></svg>
        <span>1,000</span>
        <span class="sr-only">골드</span>
      </span>
    </button>

    <p class="toast" id="toast" role="status"></p>
  </body>
</html>
